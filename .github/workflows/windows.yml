name: Windows 打包验收

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows x64 原生应用
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: 安装 Host 依赖
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmmirror.com
      - name: 安装前端依赖
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmmirror.com
      - name: 检查 Host 类型
        run: npm run typecheck
      - name: 检查发布版本约束
        run: npm run test:release
      - name: 检查 Windows 环境准备和下载
        run: node --expose-internals --import tsx --test packages/builtin/test/bootstrap.test.ts packages/builtin/test/setup.test.ts packages/builtin/test/setup-download.test.ts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: 安装轻量后端测试依赖
        run: |
          python -m pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r backend/requirements-test.txt
          python -m nltk.downloader -e punkt_tab
      - name: 准备媒体回归工具
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          ffprobe -version
      - name: 检查 Host、中文上传、扩展和任务生命周期
        shell: pwsh
        run: |
          $env:YOUDUB_TEST_PYTHON = (Get-Command python).Source
          npm test
      - name: 检查全部 Python 回归与设备回退
        shell: pwsh
        run: |
          $env:YOUDUB_TEST_PYTHON = (Get-Command python).Source
          npm run test:backend -- -q
      - name: 构建 Windows 便携包
        run: npm run build:desktop
      - name: 准备 WebView2 运行时
        run: ./scripts/prepare-windows-ci.ps1
      - name: 解压并验收原生窗口、页面和进程清理
        run: npm run test:windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/YouDub-*-windows-x64.zip
            dist/YouDub-*-windows-x64.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-smoke-evidence
          path: |
            dist/windows-smoke.json
            dist/windows-smoke.png
            .cache/windows-smoke/**/desktop.log
            .cache/windows-smoke/**/normal.json
            .cache/windows-smoke/**/held.json
            .cache/windows-smoke/**/duplicate.json
            .cache/windows-smoke/**/reopened.json
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
