name: 桌面版本发布

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'liuzhao1225/YouDub-webui' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 校验 tag、版本和 main 来源
        run: |
          node --input-type=module -e 'import { appVersion, validateReleaseVersion } from "./scripts/release-version.mjs"; validateReleaseVersion(appVersion, process.env.GITHUB_REF_NAME)'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml

  sign:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 安装签名脚本依赖
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmmirror.com
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: 解包已构建应用
        run: |
          mkdir -p dist
          tar -xzf "$RUNNER_TEMP/unsigned/YouDub-unsigned.tar.gz" -C dist
      - name: 签名应用
        env:
          YOUDUB_APPLE_CREDENTIALS_DIR: ${{ runner.temp }}/apple-signing
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node scripts/prepare-ci-signing.mjs
          node scripts/sign-mac.mjs dist/YouDub.app --sign-only
      - name: 验证桌面服务与运行后签名
        run: node scripts/smoke-mac.mjs dist/YouDub.app
      - name: 打包与 Apple 公证
        env:
          YOUDUB_APPLE_CREDENTIALS_DIR: ${{ runner.temp }}/apple-signing
        run: node scripts/sign-mac.mjs dist/YouDub.app --package-signed
      - name: 清除签名材料
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple-signing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: |
            dist/YouDub-*.dmg
            dist/YouDub-*.dmg.sha256
            dist/dmg-notary.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [quality, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release
      - name: 校验并发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: release
        run: |
          sha256sum --check ./*.sha256
          version="${GITHUB_REF_NAME#v}"
          for suffix in macOS-arm64.dmg windows-x64.zip windows-x64-Setup.exe; do
            cp "YouDub-$version-$suffix" "YouDub-$suffix"
            sha256sum "YouDub-$suffix" > "YouDub-$suffix.sha256"
          done
          sha256sum --check ./YouDub-macOS-arm64.dmg.sha256 ./YouDub-windows-x64.zip.sha256 ./YouDub-windows-x64-Setup.exe.sha256
          cat > notes.md <<'EOF'
          macOS Apple Silicon 安装包，最低 macOS 14。已通过 Developer ID 签名、Apple 公证和 Gatekeeper 检查。

          Windows x64 提供 Setup.exe 安装包和 ZIP 便携包，支持 Windows 10 22H2 / Windows 11。安装包支持安装、重装、快捷方式和保留数据卸载；便携包完整解压后运行 YouDub.exe。需要 WebView2 Evergreen Runtime；未进行 Authenticode 签名。已通过原生窗口、页面渲染和退出清理测试。

          首次启动会在 YouDub 数据文件夹准备独立 Python、FFmpeg 和模型，主要资源使用阿里与 ModelScope 国内源，并引导配置和测试翻译服务；也可稍后在设置页填写。

          环境与模型准备页新增诊断日志和 Issue 反馈入口：点击反馈会复制完整日志，并打开预填版本、系统和阶段的 GitHub 表单，粘贴后即可提交。错误详情位于日志末尾，提交前可检查和编辑。

          设置页与首次翻译配置页现在会显示已保存 API Key 的前 6 位及 `****`，短密钥全部隐藏。更换服务地址或清除密钥时，旧提示随之消失；留空保留、输入新值替换。

          [Windows EXE 安装包](https://github.com/liuzhao1225/YouDub-webui/releases/latest/download/YouDub-windows-x64-Setup.exe) · [macOS DMG](https://github.com/liuzhao1225/YouDub-webui/releases/latest/download/YouDub-macOS-arm64.dmg) · [Windows ZIP](https://github.com/liuzhao1225/YouDub-webui/releases/latest/download/YouDub-windows-x64.zip)

          [安装与升级说明](https://github.com/liuzhao1225/YouDub-webui/blob/main/docs/upgrade.md) · [自动发布与签名保护](https://github.com/liuzhao1225/YouDub-webui/blob/main/docs/releasing.md)
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "YouDub $GITHUB_REF_NAME" --notes-file notes.md ./YouDub-*.dmg ./YouDub-*.dmg.sha256 ./YouDub-*.zip ./YouDub-*.zip.sha256 ./YouDub-*.exe ./YouDub-*.exe.sha256
